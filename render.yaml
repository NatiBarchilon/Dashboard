services:
  - type: web
    name: freezem-sensor-watch
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 180 app:app
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DASHBOARD_USERNAME
        value: admin
      - key: DASHBOARD_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        value: eu-central-1
      - key: S3_ENDPOINT_URL
        sync: false
      - key: SENSOR_CONFIG_JSON
        sync: false
      - key: DATA_TIMEZONE
        value: Asia/Jerusalem
      - key: UPLOAD_GRACE_SECONDS
        value: "120"
      - key: DISABLE_BACKGROUND_MONITOR
        value: "true"
